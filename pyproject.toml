[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "RAG seminar — build a complete RAG system from scratch"
requires-python = ">=3.11"
dependencies = [
  # RAG framework
  "llama-index-core>=0.11.0,<0.13.0",
  "llama-index-vector-stores-chroma>=0.2.0",
  "llama-index-embeddings-gemini>=0.2.0",
  "llama-index-llms-gemini>=0.3.0",
  "llama-index-llms-groq>=0.2.0",
  "llama-index-llms-ollama>=0.3.0",
  "llama-index-postprocessor-cohere-rerank>=0.2.0",
  "llama-index-embeddings-huggingface>=0.3.0",
  "llama-index-readers-web>=0.2.0",
  "llama-index-retrievers-bm25>=0.3.0",

  # Vector store
  "chromadb>=0.5.0,<0.7.0",

  # Embeddings (local fallback)
  "sentence-transformers>=3.0.0,<4.0.0",

  # Sparse retrieval
  "rank-bm25>=0.2.2",

  # Evaluation
  "ragas~=0.2.0",

  # LLM clients
  "google-generativeai>=0.8.0,<1.0.0",
  "groq>=0.11.0,<1.0.0",
  "cohere>=5.0.0,<6.0.0",
  "openai>=1.40.0,<2.0.0",

  # Frontend
  "gradio>=4.40.0,<5.0.0",

  # Notebooks
  "jupyter>=1.0.0",
  "jupyterlab>=4.0.0,<5.0.0",
  "ipykernel>=6.0.0",
  "nbformat>=5.0.0",

  # Data + utilities
  "datasets>=2.20.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "tqdm>=4.66.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",

  # Dev
  "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
